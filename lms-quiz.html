<body>
<header class="quiz-topbar">
<a aria-label="screenings4u Learning Center dashboard" class="quiz-brand" href="lms-dashboard.html">
<img alt="screenings4u Learning Center" src="images/training-logo2.png"/>
</a>
<div class="quiz-topbar-copy">
<span>SCREENINGS4U LEARNING CENTER</span>
<strong id="topbarTitle">Knowledge Check</strong>
</div>
<a class="quiz-exit" href="lms-course-player.html" id="coursePlayerLink">Return to Course</a>
</header>
<main class="quiz-page">
<section class="quiz-hero">
<div>
<span class="quiz-eyebrow" id="quizType">MODULE KNOWLEDGE CHECK</span>
<h1 id="quizTitle"></h1>
<p id="quizDescription"></p>
</div>
<div aria-label="Quiz progress" class="quiz-hero-progress">
<div class="quiz-progress-row">
<span id="progressLabel"></span>
<strong id="progressPercent"></strong>
</div>
<div class="quiz-track"><div class="quiz-fill" id="quizFill"></div></div>
</div>
</section>
<div class="quiz-layout">
<section aria-live="polite" class="quiz-card">

</section>

<p id="sideDescription"></p>
<dl class="quiz-stats">
<div><dt>Questions</dt><dd id="questionCount"></dd></div>
<div><dt id="passingLabel">Required Score</dt><dd id="passingScore"></dd></div>
<div><dt>Attempts</dt><dd id="attempts"></dd></div>
</dl>
</section>
<section class="quiz-side-card" id="questionNavigationCard">
<div class="quiz-side-heading">
<h2>Questions</h2>
<span>Jump to a question</span>
</div>
<div class="question-list" id="questionList"></div>
</section>
</aside>
</div>
</main>
