<body class="lms-course-player-immersive" data-s4u-portal="training">
<main class="course-player-shell">

<a aria-label="Learning Center dashboard" class="course-player-brand" href="lms-dashboard.html">
<img alt="screenings4u Learning Center" src="images/training-logo.png"/>
</a>
<div class="course-player-topbar-actions">
<button aria-controls="course-curriculum-panel" aria-expanded="false" class="course-player-tool curriculum-toggle" data-curriculum-toggle="" type="button">
<svg aria-hidden="true" viewbox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"></path></svg>

</button>
<a class="course-player-exit" href="lms-dashboard.html">

<section class="course-player-header">

</div>
<div class="course-player-progress-summary">

<div class="course-player-progress-track"><div class="course-player-progress-fill" data-course-progress-fill=""></div></div>

</section>

<div class="course-player-stage-top">

</div>
<span class="course-player-lesson-count" data-current-lesson-count=""></span>
</div>
<div class="course-player-lesson-panel">

<p class="course-player-lesson-intro" data-current-intro=""></p>
</div>
</div>
<div class="course-player-stage-footer">

<svg aria-hidden="true" viewbox="0 0 24 24"><path d="M19 12H5"></path><path d="m12 19-7-7 7-7"></path></svg>

</button>
<button class="course-player-next" data-course-next="" type="button">

</div>
</div>

<div class="course-player-sidebar-kicker">COURSE CONTENT</div>

<div class="course-player-sidebar-scroll"></div>
